spring.application.name=software-gimnasio

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gimnasio_nuevo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

app.version=1.0.9
actualizacion.repositorio=FrancoCanone/SoftwareGimnasio2

molinete.puerto-fallback=${MOLINETE_PUERTO_FALLBACK:COM8}
molinete.baud=${MOLINETE_BAUD:9600}